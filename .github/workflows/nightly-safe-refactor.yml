name: Nightly Safe Refactor (Non-Breaking)

on:
  schedule:
    - cron: '11 2 * * *' # 02:11 Europe/London nightly
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  safe-refactor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with: { version: 8.10.5 }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run safe refactor (type-aware)
        run: pnpm safe:refactor

      - name: Format
        run: pnpm format

      - name: Lint (report-only)
        run: pnpm lint:safe || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit/Integration Tests
        run: pnpm test:ci

      - name: E2E Tests (optional, non-blocking if not configured)
        run: pnpm e2e:ci || true

      - name: Bundle diff (≤ 0.5% allowed)
        run: |
          # If you have a prior baseline artifact, compare. Otherwise just generate report.
          echo "Bundle diff check placeholder (configure with your analyzer)."

      - name: Detect diff size (limit 300 changed lines)
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
            exit 0
          fi
          LINES=$(git diff --staged --numstat | awk '{s+=$1+$2} END {print s}')
          echo "Changed lines: $LINES"
          if [ "${LINES:-0}" -gt "300" ]; then
            echo "Too many changes ($LINES). Aborting PR."
            git reset --hard
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "lines=$LINES" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/nightly-safe-refactor
          delete-branch: true
          commit-message: 'chore(safe): nightly type-aware refactor (no behavior change)'
          title: 'Nightly Safe Refactor: type-aware, non-breaking polish'
          body: |
            Automated **non-breaking** refactor (${{ steps.diff.outputs.lines }} lines changed):
            - Import cleanup & type-only imports
            - `let`→`const` where safe
            - Remove unused imports/variables
            - Prettier formatting

            **Guardrails passed:** typecheck, tests, build, (optional) e2e.  
            **Policy:** No behavior/API changes. Abort if risk detected.

          labels: maintenance, refactor, non-breaking, automation

      - name: Summary comment
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" == "true" ]; then
            echo "✅ Safe refactor PR created with ${{ steps.diff.outputs.lines }} changed lines"
          else
            echo "ℹ️  No changes needed or changes too large (>300 lines)"
          fi
